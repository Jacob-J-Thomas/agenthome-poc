name: Issue governance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 6"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-governance-${{ github.repository }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit active issue hierarchy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit issue hierarchy and dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/audit-issue-hierarchy.ps1 -Repository $env:GITHUB_REPOSITORY -Campaign 332 -Phase 523
