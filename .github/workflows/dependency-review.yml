name: Dependency review

on:
  pull_request:
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
