name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    # Tool setup and diagnostic upload are outside the repository verifier budget.
    # Promotion runs once per stable merge candidate, so the exhaustive child receives its
    # #422-required inclusive 600-second certification window instead of constraining the draft edit loop.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify solution
        shell: pwsh
        run: ./scripts/verify-with-watchdog.ps1 -Configuration Release -DeadlineSeconds 600

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-diagnostics-${{ github.run_attempt }}
          path: |
            tests/VerificationResults/**
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 30
