name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    # Tool setup and diagnostic upload are outside the repository verifier budget.
    # scripts/verify-with-watchdog.ps1 owns the exact inclusive 600-second child deadline.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify solution
        shell: pwsh
        run: ./scripts/verify-with-watchdog.ps1 -Configuration Release

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-diagnostics-${{ github.run_attempt }}
          path: |
            tests/VerificationResults/**
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 30
